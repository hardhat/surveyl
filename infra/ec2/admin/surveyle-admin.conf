# Reference Apache2 vhost for the Surveyle admin dashboard (spec 4.3/13.1), served
# alongside the player SPA and Python cron job on the same EC2 instance. Install with:
#   sudo cp infra/ec2/admin/surveyle-admin.conf /etc/apache2/sites-available/
#   sudo a2ensite surveyle-admin
#   sudo a2enmod ssl rewrite
#   sudo systemctl reload apache2
#
# Requires PHP 8.x via mod_php or php-fpm (php8.5 is available on this host) and the
# secrets file /etc/surveyle/surveyle.env (same file/format the Python ingestion side
# reads, see infra/ec2/ingestion/db.py) containing:
#   SUPABASE_URL=...
#   SUPABASE_SERVICE_ROLE_KEY=...   # server-side only, never exposed to this vhost's DocumentRoot
#   SUPABASE_ANON_KEY=...           # used only for the admin login password grant
#   SURVEYLE_HOME=/opt/surveyle     # so CliCandidateRegenerator can invoke the Python venv

<VirtualHost *:443>
    ServerName admin.surveyle.co.uk
    DocumentRoot /opt/surveyle/infra/ec2/admin/public

    # src/, tests/, templates/, and autoload.php live outside DocumentRoot so they are
    # never directly web-servable, regardless of DirectoryIndex/rewrite rules below.
    <Directory /opt/surveyle/infra/ec2/admin/public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/admin.surveyle.co.uk/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/admin.surveyle.co.uk/privkey.pem

    ErrorLog ${APACHE_LOG_DIR}/surveyle-admin-error.log
    CustomLog ${APACHE_LOG_DIR}/surveyle-admin-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName admin.surveyle.co.uk
    Redirect permanent / https://admin.surveyle.co.uk/
</VirtualHost>
